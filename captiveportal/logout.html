<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Broadband — Disconnected</title>
    <style>
        body {
            min-height: 100vh;
            background: #090d16;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: rgba(17, 24, 39, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 28px 24px;
            text-align: center;
        }
        h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .summary {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 12.5px;
            text-align: left;
            line-height: 1.8;
        }
        .summary div { display: flex; justify-content: space-between; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: #4f46e5;
            color: #fff;
            font-weight: 800;
            font-size: 14px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Session Disconnected</h2>
        <p>You have safely logged out of the hotspot network.</p>
        <div class="summary">
            <div><span>Voucher / User:</span> <strong>$(username)</strong></div>
            <div><span>Session Duration:</span> <strong>$(uptime)</strong></div>
            <div><span>Downloaded:</span> <strong>$(bytes-out-nice)</strong></div>
            <div><span>Uploaded:</span> <strong>$(bytes-in-nice)</strong></div>
        </div>
        <form action="$(link-login)" name="login" method="get">
            <button type="submit" class="btn">Log In Again</button>
        </form>
    </div>
</body>
</html>
