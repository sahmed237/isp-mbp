<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspot Notice — Apex Broadband</title>
    <style>
        body { min-height: 100vh; background: #090d16; color: #f8fafc; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; margin: 0; text-align: center; padding: 20px; }
        .card { max-width: 380px; padding: 28px 24px; background: #111827; border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 24px; }
        h2 { font-size: 19px; color: #fca5a5; margin-bottom: 8px; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
        a { display: inline-block; padding: 12px 20px; background: #4f46e5; color: #fff; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Hotspot Notice</h2>
        <p>$(error)</p>
        <a href="$(link-login)">Return to Login</a>
    </div>
</body>
</html>
