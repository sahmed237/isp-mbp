<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2; url=$(link-redirect)">
    <title>Connected — Apex Broadband</title>
    <style>
        body {
            min-height: 100vh;
            background: #090d16;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            text-align: center;
        }
        .box {
            max-width: 360px;
            padding: 30px 24px;
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 24px;
        }
        .icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 26px;
        }
        h2 { font-size: 19px; margin-bottom: 6px; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
        a { color: #38bdf8; font-size: 12.5px; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">&check;</div>
        <h2>You Are Connected!</h2>
        <p>Welcome, <strong>$(username)</strong>. Redirecting you to the internet...</p>
        <a href="$(link-status)">View Session Status &rarr;</a>
    </div>
</body>
</html>
